/* Layout: one operations console. Header strip, tab bar, month bar, then a single working area.

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- derived data ---------- */
function derive(){
  const arr=o=>Object.values(o);
  D.cases=arr(S.cases);D.decs=arr(S.decisions);D.lines=arr(S.lines);D.ents=arr(S.ents);D.ops=arr(S.ops);
  D.audit=arr(S.audit).sort((a,b)=>b.ts-a.ts);
  D.decByCode={};D.linesByDec={};
  D.decs.forEach(d=>{(D.decByCode[d.code]=D.decByCode[d.code]||[]).push(d)});
  D.lines.forEach(l=>{(D.linesByDec[l.decId]=D.linesByDec[l.decId]||[]).push(l)});
}
function decKind(d){
  const sib=(D.decByCode[d.code]||[]).slice().sort((a,b)=>(a.issueDate||'').localeCompare(b.issueDate||'')||(a.createdAt||0)-(b.createdAt||0));
  return sib.length&&sib[0].id===d.id?'جديد':'مجدد';
}
function decEnd(d){return(D.linesByDec[d.id]||[]).reduce((m,l)=>l.endMonth>m?l.endMonth:m,'')}
function decStart(d){return(D.linesByDec[d.id]||[]).reduce((m,l)=>(!m||l.startMonth<m)?l.startMonth:m,'')}
function entStatus(e){
  if(e.deferred)return'مؤجل';
  if(e.followResult)return e.followResult;
  if(e.sent)return e.resentCount?'تمت إعادة الإرسال':'تم الإرسال';
  return'مستحق';
}
const statusClass={'مستحق':'','تم الإرسال':'info','تمت إعادة الإرسال':'warn','تم الصرف':'good','لم يتم الصرف':'bad','مؤجل':'warn'};
function followDone(e){const a=e.attempts||[];return a.some(x=>x.answered)||a.length>=3}
function nameOf(id){if(!id)return'—';if(id===me.id)return me.name||'أنا';return names[id]||'مستخدم'}
function entsOf(m){return D.ents.filter(e=>e.month===m)}
function caseName(c){return S.cases[c]?S.cases[c].name:'(كود غير مسجل)'}
function overlap(code,service,start,end,ignoreDec){
  for(const d of(D.decByCode[code]||[])){
    if(d.status!=='مستمر'||d.id===ignoreDec)continue;
    for(const l of(D.linesByDec[d.id]||[])){
      if(l.service===service&&!(end<l.startMonth||start>l.endMonth))return{dec:d,line:l};
    }
  }
  return null;
}
function closeLists(){
  const ended=[],noReply=[],seen=new Set();
  D.decs.forEach(d=>{if(d.status==='مستمر'){const e=decEnd(d);if(e&&e<month)ended.push(d)}});
  D.ents.forEach(e=>{
    if(e.month===month&&e.deferred&&(e.carried||[]).length){
      const d=S.decisions[e.decId];
      if(d&&d.status==='مستمر'&&!seen.has(d.id)){seen.add(d.id);noReply.push(d)}
    }
  });
  return{ended,noReply};
}

let queue=Promise.resolve();
function enqueue(fn){const p=queue.then(fn);queue=p.catch(()=>{});return p}

const updDoc=(col,id,data)=>enqueue(()=>db.collection(col).doc(id).update(data));

}
function toast(msg){
  const t=$('#toast');t.innerHTML='<div>'+esc(msg)+'</div>';
  clearTimeout(toast.t);toast.t=setTimeout(()=>{t.innerHTML=''},3800);
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return'تعذر الحفظ. على الأرجح ليس لديك صلاحية الكتابة في هذه الصفحة.';
  if(c==='quota_exceeded')return'امتلأت سعة قاعدة البيانات. احذفي بيانات قديمة أو تواصلي مع المسؤول.';
  if(c==='resource_exhausted')return'عدد كبير من العمليات في وقت قصير. انتظري لحظات وأعيدي المحاولة.';
  return'تعذر الحفظ: '+((e&&e.message)||'خطأ غير معروف');
}
async function guard(fn){
  if(!db){toast('قاعدة البيانات غير متاحة في هذا العرض.');return false}
  if(canWrite===false){toast('حسابك للقراءة فقط.');return false}
  try{await fn();return true}catch(e){toast(errMsg(e));return false}
}

async function resolveNames(){
  if(!user||!user.profiles)return;
  const ids=new Set();
  D.audit.forEach(a=>a.by&&ids.add(a.by));D.ops.forEach(o=>o.by&&ids.add(o.by));
  D.ents.forEach(e=>(e.attempts||[]).forEach(a=>a.by&&ids.add(a.by)));
  const need=[...ids].filter(i=>i!==me.id&&!askedNames.has(i));
  if(!need.length)return;
  need.forEach(i=>askedNames.add(i));
  try{
    const ps=await user.profiles(need);let any=false;
    need.forEach(i=>{if(ps[i]&&ps[i].name){names[i]=ps[i].name;any=true}});
    if(any)scheduleRender();
  }catch(e){}
}

function onLineChange(i,f,v){
  const l=DF.lines[i];
  if(f==='service'){l.service=v;if(svc(v).cycle==='مرة واحدة'){l.months=1;l.end=l.start}}
  else if(f==='amount'){l.amount=v;return}
  else if(f==='note'){l.note=v;return}
  else if(f==='months'){l.months=Math.max(1,+v||1);if(!l.tE&&l.start)l.end=addMonths(l.start,l.months-1)}
  else if(f==='start'){l.start=v;l.tS=true;if(!l.tE)l.end=addMonths(v,l.months-1)}
  else if(f==='end'){l.end=v;l.tE=true}
  drawLines();
}
async function saveDecision(){
  const g=id=>$('#'+id).value.trim();
  DF.code=g('df-code');DF.text=g('df-text');DF.donor=g('df-donor');DF.issue=g('df-issue');
  if(!S.cases[DF.code])return toast('كود الحالة غير مسجل. سجلي الحالة أولاً.');
  if(!DF.issue)return toast('اختاري تاريخ القرار.');
  if(!DF.text)return toast('اكتبي نص القرار.');
  if(!DF.lines.length)return toast('أضيفي بنداً واحداً على الأقل.');
  const cleaned=[];
  for(let i=0;i<DF.lines.length;i++){
    const l=DF.lines[i];const n=spanMonths(l.start,l.end);
    if(!l.start||!l.end||n<1)return toast('البند '+(i+1)+': تواريخ غير صحيحة.');
    if(l.amount===''||isNaN(+l.amount))return toast('البند '+(i+1)+': اكتبي القيمة.');
    if(n!==+l.months&&!l.note.trim())return toast('البند '+(i+1)+': المدة المكتوبة تخالف المحسوبة. اكتبي ملاحظة.');
    const ov=overlap(DF.code,l.service,l.start,l.end,null);
    if(ov)return toast('البند '+(i+1)+': للحالة بند «'+l.service+'» ساري في قرار '+(ov.dec.no||'')+' ('+fmtMonth(ov.line.startMonth)+' إلى '+fmtMonth(ov.line.endMonth)+'). أوقفي القرار القديم أولاً.');
    cleaned.push(l);
  }
  const id=newId('d');const no='ق-'+pad(D.decs.length+1);
  const ok=await guard(async()=>{
    await setDoc('decisions',id,{id:id,no:no,code:DF.code,text:DF.text,donor:DF.donor,issueDate:DF.issue,status:'مستمر',createdAt:Date.now(),createdBy:me.id});
    for(let i=0;i<cleaned.length;i++){
      const l=cleaned[i];const lid=id+'_'+(i+1);
      await setDoc('lines',lid,{id:lid,decId:id,code:DF.code,service:l.service,amount:+l.amount,months:+l.months,startMonth:l.start,endMonth:l.end,mismatchNote:l.note.trim()});
    }
    await logAudit('قرار جديد',DF.code,no+' · '+cleaned.length+' بنود');
  });
  if(ok){closeModal();toast('تم حفظ القرار '+no+'.')}
}

/* ---------- monthly generation, bulk, follow-up ---------- */
async function generateMonth(){
  const todo=[];
  D.decs.filter(d=>d.status==='مستمر').forEach(d=>{
    (D.linesByDec[d.id]||[]).forEach(l=>{
      const s=svc(l.service);if(s.kind==='تغطية')return;
      const inRange=s.cycle==='مرة واحدة'?l.startMonth===month:(l.startMonth<=month&&month<=l.endMonth);
      if(!inRange)return;
      const id=l.id+'_'+month;if(S.ents[id])return;
      const prev=S.ents[l.id+'_'+addMonths(month,-1)];
      const carried=(prev&&entStatus(prev)==='مؤجل')?(prev.carried||[]).concat([addMonths(month,-1)]):[];
      todo.push({id:id,code:l.code,decId:l.decId,lineId:l.id,service:l.service,kind:s.kind,month:month,base:+l.amount,amount:(+l.amount)*(1+carried.length),carried:carried,sent:false,attempts:[],followResult:null,deferred:false,createdAt:Date.now(),createdBy:me.id});
    });
  });
  if(!todo.length)return toast('لا توجد استحقاقات جديدة لـ'+fmtMonth(month)+'.');
  toast('جارٍ توليد '+todo.length+' استحقاق…');
  const ok=await guard(async()=>{for(const e of todo)await setDoc('ents',e.id,e);await logAudit('توليد استحقاقات',fmtMonth(month),todo.length+' استحقاق')});
  if(ok)toast('تم توليد '+todo.length+' استحقاق لـ'+fmtMonth(month)+'.');
}
async function bulkApply(act){
  const ids=[...SEL].filter(id=>S.ents[id]&&S.ents[id].kind===F.entKind);
  const label=(BULK[F.entKind]||[]).find(a=>a.act===act).label;
  let n=0,skip=0;
  const ok=await guard(async()=>{
    for(const id of ids){
      const e=S.ents[id];
      if(act==='send'&&e.sent){skip++;continue}
      if(act==='resend'&&!e.sent){skip++;continue}
      const patch=act==='send'?{sent:true,sentAt:Date.now(),sentBy:me.id}:{sent:true,sentAt:Date.now(),sentBy:me.id,resentCount:(e.resentCount||0)+1,attempts:[],followResult:null,deferred:false};
      await updDoc('ents',id,patch);n++;
    }
    if(n)await logAudit(label,fmtMonth(month)+' · '+F.entKind,n+' استحقاق');
  });
  if(ok){SEL.clear();toast(n?'تم تطبيق «'+label+'» على '+n+' استحقاق'+(skip?' وتخطي '+skip:'')+'.':'لا استحقاقات مناسبة في التحديد.')}
}
async function recordAttempt(id,a){
  const e=S.ents[id];if(!e)return;
  const attempts=(e.attempts||[]).concat([{at:Date.now(),by:me.id,answered:a!=='0'}]);
  const patch={attempts:attempts};
  let msg='';
  if(a==='paid'){patch.followResult='تم الصرف';msg='سُجل: رد وتم الصرف.'}
  else if(a==='notpaid'){patch.followResult='لم يتم الصرف';msg='سُجل: رد ولم يتم الصرف.'}
  else if(attempts.length>=3){patch.deferred=true;patch.followResult='لم يتم الصرف';msg='اكتملت 3 محاولات بدون رد. تأجل الاستحقاق للشهر القادم.'}
  else msg='سُجلت المحاولة '+attempts.length+' من 3.';
  const ok=await guard(async()=>{await updDoc('ents',id,patch);await logAudit('متابعة',e.code,e.service+' · '+fmtMonth(e.month)+' · '+msg)});
  if(ok)toast(msg);
}

/* ---------- operations form ---------- */
function bindOpForm(){
  const sel=$('#op-type');if(!sel)return;
  const upd=()=>{
    const t=TASKS[+sel.value];
    $('#op-code-l').hidden=t.scope!=='حالة';
    $('#op-dept-l').hidden=t.scope==='حالة';
    $('#op-info').textContent='الفريق: '+t.team+' · التصنيف: '+t.scope+' · الوزن: '+t.weight;
  };
  sel.addEventListener('change',upd);upd();
}
async function saveOp(){
  const t=TASKS[+$('#op-type').value];
  const cd=$('#op-code').value.trim(),dept=$('#op-dept').value.trim();
  if(t.scope==='حالة'&&!S.cases[cd])return toast('اكتبي كود حالة مسجل لهذه العملية.');
  if(t.scope==='عامة'&&!dept)return toast('اكتبي الجهة أو الإدارة.');
  const id=newId('o');
  const ok=await guard(async()=>{
    await setDoc('ops',id,{id:id,type:t.name,team:t.team,weight:t.weight,scope:t.scope,code:t.scope==='حالة'?cd:'',dept:t.scope==='عامة'?dept:'',date:$('#op-date').value||todayISO(),status:$('#op-status').value,notes:$('#op-notes').value.trim(),by:me.id,createdAt:Date.now()});
    await logAudit('عملية',t.scope==='حالة'?cd:dept,t.name);
  });
  if(ok){$('#op-code').value='';$('#op-dept').value='';$('#op-notes').value='';toast('تم تسجيل العملية.')}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(e.target.id==='modal'){closeModal();return}
  if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case'tab':tab=v;render();break;
    case'closeModal':closeModal();break;
    case'newCase':openCaseForm();break;
    case'saveCase':saveCase(v);break;
    case'editCase':openCaseForm(S.cases[v]);break;
    case'caseFile':openCaseFile(v);break;
    case'newDecision':openDecisionForm();break;
    case'newDecisionFor':openDecisionForm({code:v});break;
    case'renew':{const d=S.decisions[v];openDecisionForm({code:d.code,text:d.text,donor:d.donor,lines:(D.linesByDec[d.id]||[]).map(l=>({service:l.service,amount:l.amount,months:l.months}))});DF.renew=true;drawDF();break}
    case'addLine':DF.lines.push(newLine(suggestStart(DF.issue)));drawLines();break;
    case'rmLine':if(DF.lines.length>1){DF.lines.splice(+v,1);drawLines()}else toast('يجب أن يبقى بند واحد على الأقل.');break;
    case'saveDecision':saveDecision();break;
    case'stopOne':openStopForm([v],'موقوف','إيقاف أو سحب قرار');break;
    case'doStop':{const ids=b.dataset.ids.split(',');const r=$('#st-reason').value.trim();if(!r)return toast('اكتبي السبب.');stopDecisions(ids,v,r);break}
    case'entKind':F.entKind=v;SEL.clear();shellTab=null;render();break;
    case'generate':generateMonth();break;
    case'bulk':bulkApply(v);break;
    case'clearSel':SEL.clear();render();break;
    case'attempt':recordAttempt(v,b.dataset.a);break;
    case'selClose':{const list=closeLists()[v==='ended'?'ended':'noReply'];list.forEach(d=>SEL.add(v+':'+d.id));render();break}
    case'stopSel':{const ids=[...SEL].filter(k=>k.startsWith(v+':')).map(k=>k.split(':')[1]);if(!ids.length)return toast('حددي قراراً واحداً على الأقل.');const reason=v==='ended'?'انتهاء المدة':'عدم الرد لشهرين متتاليين';stopDecisions(ids,'موقوف',reason);break}
    case'saveOp':saveOp();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='monthSel'){month=t.value;SEL.clear();render();return}
  if(t.dataset.f){F[t.dataset.f]=t.value;render();return}
  if(t.dataset.sel){t.checked?SEL.add(t.dataset.sel):SEL.delete(t.dataset.sel);render();return}
  if(t.dataset.sel2){t.checked?SEL.add(t.dataset.sel2):SEL.delete(t.dataset.sel2);return}
  if(t.hasAttribute('data-selall')){const list=entsOf(month).filter(x=>x.kind===F.entKind);list.forEach(x=>t.checked?SEL.add(x.id):SEL.delete(x.id));render();return}
  if(t.dataset.opstatus){const id=t.dataset.opstatus;const o=S.ops[id];guard(async()=>{await updDoc('ops',id,{status:t.value});await logAudit('تحديث عملية',o.code||o.dept,o.type+' ← '+t.value)});return}
  if(DF){
    if(t.id==='df-code'){DF.code=t.value.trim();const n=$('#df-name');if(n)n.value=S.cases[DF.code]?S.cases[DF.code].name:'';return}
    if(t.id==='df-issue'){DF.issue=t.value;const st=suggestStart(DF.issue);DF.lines.forEach(l=>{if(!l.tS){l.start=st;if(!l.tE)l.end=addMonths(st,l.months-1)}});drawLines();return}
    const row=t.closest('.lrow');if(row&&t.dataset.lf){onLineChange(+row.dataset.i,t.dataset.lf,t.value)}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f&&t.tagName==='INPUT'){F[t.dataset.f]=t.value;scheduleRender()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- boot ---------- */
async function boot(){
  $('#monthSel').innerHTML=monthOpts(month);
  renderTabs();render();
  const c=window.claude;
  if(!c||!c.use){$('#meChip').textContent='غير متصل';$('#loadNote').innerHTML='<div class="notice">قاعدة البيانات غير متاحة في هذا العرض. افتحي الصفحة من رابطها بعد تسجيل الدخول.</div>';return}
  const lim=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
  try{user=await lim(c.use('user'),8000)}catch(e){user=null}
  try{db=await lim(c.use('db'),8000)}catch(e){db=null}
  if(user){try{const m=await lim(user.me(),5000);if(m)me={id:m.id||'anon',name:m.name||''};canWrite=await lim(user.can('data.write'),5000)}catch(e){}}
  $('#meChip').textContent=me.name?('أنت: '+me.name):'مستخدم';
  const pc=$('#permChip');pc.hidden=false;
  if(canWrite===false){pc.textContent='قراءة فقط';pc.className='chip no';document.documentElement.classList.add('ro');$('#app').classList.add('ro')}
  else if(canWrite===true){pc.textContent='صلاحية كتابة';pc.className='chip ok'}
  else{pc.textContent='الصلاحية غير مؤكدة';pc.className='chip'}
  if(!db){$('#loadNote').innerHTML='<div class="notice">قاعدة البيانات غير متاحة لهذا الحساب أو هذا العرض.</div>';return}
  const timer=setTimeout(()=>{if(Object.keys(loaded).length<6)$('#loadNote').innerHTML='<div class="notice">تعذر الوصول للبيانات حالياً، وقد تكون المعروضة غير محدّثة.</div>'},10000);
  ['cases','decisions','lines','ents','ops','audit'].forEach(col=>{
    const q=col==='audit'?db.collection(col).orderBy('ts','desc').limit(200):db.collection(col);
    q.onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=Object.assign({},d.data(),{id:d.id})});
      S[col]=m;
      if(!snap.metadata.fromCache)loaded[col]=true;else loaded[col]=loaded[col]||false;
      if(Object.values(loaded).filter(Boolean).length>=6){clearTimeout(timer);$('#loadNote').innerHTML=''}
      scheduleRender();
    },err=>{$('#loadNote').innerHTML='<div class="notice">تعذر قراءة البيانات ('+esc(err&&err.code||'خطأ')+').</div>'});
  });
}
boot();
})();
</script>
